
name: Terraform CI

on:
  push:
    branches:
      - main
      - "harden/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Format and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize root Terraform
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate root Terraform
        run: terraform validate -no-color

      - name: Initialize S3 backend bootstrap
        working-directory: bootstrap/state-backend
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate S3 backend bootstrap
        working-directory: bootstrap/state-backend
        run: terraform validate -no-color
