
name: Terraform CI

on:
  push:
    branches:
      - main
      - "harden/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Format and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize root Terraform
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate root Terraform
        run: terraform validate -no-color

      - name: Initialize S3 backend bootstrap
        working-directory: bootstrap/state-backend
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate S3 backend bootstrap
        working-directory: bootstrap/state-backend
        run: terraform validate -no-color

  iac-security:
    name: Trivy IaC Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Run Trivy as a container to avoid downloading release binaries via setup-trivy.
      - name: Scan Terraform security (Trivy container)
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            config --format table --severity HIGH,CRITICAL --exit-code 1 .

  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
